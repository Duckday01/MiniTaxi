spring.application.name=minitaxi

# ===============================
# DATABASE (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/taxi_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=taxi_user`
spring.datasource.password=taxi_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# REDIS
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
# SERVER
# ===============================
server.port=8080


jwt.secret=TAXI_SECRET_2026_TAXI_SECRET_2026_VERY_SECURE_KEY
jwt.expiration=900000
jwt.refresh-expiration=604800000
jwt.refresh-secret=TAXI_REFRESH_SECRET_2026_SEPARATE_KEY_VERY_SECURE